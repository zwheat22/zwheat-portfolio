<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume — Zach Wheat</title>
  <meta name="description" content="Resume of Zach Wheat.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="nav-wrap">
      <a class="site-title" href="index.html">Zach Wheat</a>
      <nav class="site-nav">
        <a href="index.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="resume.html" aria-current="page">Resume</a>
      </nav>
    </div>
  </header>

  <main>
    <h1>Resume</h1>
    <p class="lede">
      View below, or download the PDF directly.
    </p>

    <div class="btn-row">
      <a class="btn btn-primary" href="assets/resume.pdf" download>Download PDF</a>
      <a class="btn btn-secondary" href="assets/resume.pdf" target="_blank" rel="noopener">Open in new tab</a>
    </div>

    <div class="resume-embed-wrap">
      <embed src="assets/resume.pdf" type="application/pdf" />
      <noscript>
        <div class="resume-fallback">
          Your browser can't preview the PDF inline.
          <a href="assets/resume.pdf">Download it here</a> instead.
        </div>
      </noscript>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-wrap">
      <div class="footer-contact">
        <a href="mailto:zach@zwheat.com">zach@zwheat.com</a>
      </div>
      <div class="footer-copy">&copy; <span id="year"></span> Zach Wheat</div>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const embed = document.querySelector('.resume-embed-wrap embed');
    fetch(embed.getAttribute('src'), { method: 'HEAD' })
      .then((res) => {
        if (!res.ok) throw new Error('missing');
      })
      .catch(() => {
        embed.closest('.resume-embed-wrap').innerHTML =
          '<div class="resume-fallback">Add your resume PDF at <code>assets/resume.pdf</code> to show it here.</div>';
      });
  </script>
</body>
</html>
